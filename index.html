<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5ch Best Anime Ranking 2001-2025</title>
  <meta name="description" content="The 5ch best anime of the year ranking, 2001-2025, top 30 per year. Load your AniList or MAL list to see what you've watched.">
  <!-- Link previews (X, Bluesky, Discord, Facebook). Crawlers don't run JS, so every link shows this same preview. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://algebra123230.github.io/5ch-anime-ranking/">
  <meta property="og:title" content="5ch Best Anime Ranking 2001-2025">
  <meta property="og:description" content="The 5ch best anime of the year ranking, top 30 per year. Load your AniList or MAL list to see what you've watched.">
  <meta property="og:image" content="https://algebra123230.github.io/5ch-anime-ranking/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="data/anime.json" as="fetch" crossorigin>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="toolbar">
    <h1 lang="ja" data-ja="5ch ベストアニメランキング" data-en="5ch Best Anime Ranking">5ch ベストアニメランキング</h1>
    <div class="seg" role="group" aria-label="Title language" data-control="lang">
      <button type="button" data-value="ja" lang="ja">日本語</button>
      <button type="button" data-value="romaji">Romaji</button>
      <button type="button" data-value="en">English</button>
    </div>
    <div class="seg" role="group" aria-label="Link to" data-control="links">
      <button type="button" data-value="mal">MAL</button>
      <button type="button" data-value="anilist">AniList</button>
    </div>
    <button type="button" id="open-load">Load list</button>
  </header>
  <p id="load-status" class="banner" role="status" hidden></p>
  <p id="load-error" class="banner error" role="alert" hidden></p>
  <div id="list-bar" class="list-bar" hidden>
    <span id="list-name"></span>
    <label class="s-completed"><input type="checkbox" data-status="completed"> Completed <span class="count"></span></label>
    <label class="s-watching"><input type="checkbox" data-status="watching"> Watching <span class="count"></span></label>
    <label class="s-on_hold"><input type="checkbox" data-status="on_hold"> On hold <span class="count"></span></label>
    <label class="s-dropped"><input type="checkbox" data-status="dropped"> Dropped <span class="count"></span></label>
    <label class="s-planning"><input type="checkbox" data-status="planning"> Planning <span class="count"></span></label>
    <label><input type="checkbox" id="show-scores"> Scores</label>
    <button type="button" id="open-summary">Summary</button>
    <button type="button" id="clear-list">Clear</button>
  </div>
  <main id="table-wrap">
    <p id="status" role="alert">Loading…</p>
  </main>
  <dialog id="load-dialog" aria-labelledby="load-title">
    <div class="dialog-head">
      <h2 id="load-title">Load your list</h2>
      <button type="button" class="close" aria-label="Close">×</button>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-anilist" aria-controls="panel-anilist" aria-selected="true">AniList</button>
      <button type="button" role="tab" id="tab-mal" aria-controls="panel-mal" aria-selected="false">MAL</button>
    </div>
    <form id="panel-anilist" role="tabpanel" aria-labelledby="tab-anilist">
      <label for="anilist-name">AniList username or profile link</label>
      <div class="row">
        <input id="anilist-name" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="anilist.co/user/…">
        <button type="submit">Load</button>
      </div>
      <p class="error" role="alert" hidden></p>
    </form>
    <div id="panel-mal" role="tabpanel" aria-labelledby="tab-mal" hidden>
      <p>On MAL, open <a href="https://myanimelist.net/panel.php?go=export" target="_blank" rel="noopener">Export My List</a>, export your anime list, then choose the downloaded file.</p>
      <input type="file" id="mal-file" accept=".xml,.gz" aria-label="MAL export file">
      <p class="busy" role="status" hidden></p>
      <p class="error" role="alert" hidden></p>
    </div>
  </dialog>
  <dialog id="summary-dialog" aria-labelledby="summary-title">
    <div class="dialog-head">
      <h2 id="summary-title">List summary</h2>
      <button type="button" class="close" aria-label="Close">×</button>
    </div>
    <textarea id="summary-text" readonly rows="9" aria-label="Summary text"></textarea>
    <div class="row share-row">
      <button type="button" id="copy-summary">Copy</button>
      <a id="share-x" class="share" target="_blank" rel="noopener">Post on X</a>
      <a id="share-bluesky" class="share" target="_blank" rel="noopener">Post on Bluesky</a>
      <button type="button" id="share-native" class="share" hidden>Share…</button>
    </div>
    <p id="copy-status" role="status"></p>
  </dialog>
</body>
</html>
